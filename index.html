<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEF · نظام الحضور</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --teal:#055A72;
  --teal-dark:#033F50;
  --teal-tint:#E7F1F3;
  --burgundy:#99114A;
  --burgundy-dark:#730E3A;
  --burgundy-tint:#FBEAF1;
  --gold:#D4A017;
  --gold-light:#F4D77A;
  --bg:#FAF9F7;
  --surface:#FFFFFF;
  --ink:#152227;
  --muted:#5F7580;
  --border:#E7E4DE;
  --success:#1F7A4D;
  --danger:#B3261E;
  --radius:18px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Cairo','Tajawal',sans-serif;
  background:
    radial-gradient(1200px 500px at 50% -10%, var(--teal-tint), transparent),
    radial-gradient(900px 400px at 100% 0%, var(--burgundy-tint), transparent),
    var(--bg);
  color:var(--ink);
  min-height:100vh;
  direction:rtl;
}
#app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding-bottom:32px;}
.topbar{display:flex; align-items:center; gap:10px; padding:16px 18px 10px; justify-content:space-between;}
.brand{display:flex; align-items:center; gap:10px;}
.brand img{width:34px; height:34px; border-radius:9px;}
.brand-text{display:flex; flex-direction:column; line-height:1.1;}
.brand-text b{font-size:15px; font-weight:800; color:var(--teal-dark); letter-spacing:.3px;}
.brand-text span{font-size:10px; color:var(--muted); font-weight:600; letter-spacing:.5px;}
.icon-btn{background:var(--surface); border:1px solid var(--border); border-radius:12px; width:38px; height:38px; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; color:var(--muted);}
.icon-btn:hover{border-color:var(--teal);}
main{flex:1; padding:6px 18px 18px;}

/* ---------- Landing screen ---------- */
.landing-main{flex:1; display:flex; flex-direction:column; justify-content:center; padding:10px 20px 26px; min-height:82vh;}
.landing-hero{position:relative; text-align:center; padding:26px 10px 8px; overflow:visible;}
.blob{position:absolute; border-radius:50%; filter:blur(2px); opacity:.5; z-index:0;}
.blob1{width:170px; height:170px; background:radial-gradient(circle, var(--teal-tint), transparent 70%); top:-40px; right:-30px;}
.blob2{width:150px; height:150px; background:radial-gradient(circle, var(--burgundy-tint), transparent 70%); bottom:-30px; left:-20px;}
.landing-logo{width:88px; height:88px; border-radius:24px; position:relative; z-index:1; box-shadow:0 16px 34px -14px rgba(5,90,114,.4); animation:floatLogo 3.2s ease-in-out infinite;}
@keyframes floatLogo{0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-8px) rotate(-2deg);}}
.landing-title{position:relative; z-index:1; font-size:28px; font-weight:900; margin:18px 0 6px; background:linear-gradient(90deg, var(--teal-dark), var(--burgundy)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.landing-sub{position:relative; z-index:1; color:var(--muted); font-size:14.5px; margin:0; line-height:1.6;}
.landing-actions{display:flex; flex-direction:column; gap:14px; margin-top:34px;}
.btn-lg{padding:18px; border-radius:20px; justify-content:flex-start; gap:14px;}
.btn-emoji{font-size:26px; line-height:1;}
.btn-text-wrap{display:flex; flex-direction:column; align-items:flex-start; text-align:right; gap:2px;}
.btn-text-wrap b{font-size:15.5px; font-weight:800;}
.btn-text-wrap small{font-size:12px; font-weight:600; opacity:.85;}

/* ---------- Misc animation ---------- */
.fade-in{animation:fadeIn .35s ease both;}
@keyframes fadeIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.confetti{font-size:22px; letter-spacing:6px; margin-bottom:2px; animation:confettiDrop .5s ease both;}
@keyframes confettiDrop{from{opacity:0; transform:translateY(-12px);} to{opacity:1; transform:translateY(0);}}
.balance-flow{display:flex; align-items:center; justify-content:center; gap:10px; margin-top:14px; font-weight:800;}
.balance-flow .bf-old{color:var(--muted); text-decoration:line-through; font-size:14px;}
.balance-flow .bf-arrow{color:var(--gold); font-size:16px;}
.balance-flow .bf-new{color:var(--gold); font-size:18px;}

.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px; box-shadow:0 1px 2px rgba(21,34,39,.03), 0 10px 30px -18px rgba(21,34,39,.15);}
h1.hero{font-size:22px; font-weight:800; margin:6px 0 4px; color:var(--ink);}
p.sub{color:var(--muted); font-size:14px; margin:0 0 20px; line-height:1.6;}
label{display:block; font-size:12.5px; font-weight:700; color:var(--teal-dark); margin:0 0 6px;}
input[type=text], input[type=tel], input[type=password], input[type=number], input[type=date], input[type=time], select, textarea{
  width:100%; padding:13px 14px; border-radius:12px; border:1.5px solid var(--border); background:#fff;
  font-family:inherit; font-size:15px; color:var(--ink); margin-bottom:14px; transition:border-color .15s;
}
input:focus, select:focus, textarea:focus{outline:none; border-color:var(--teal);}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:14px 18px; border-radius:14px; border:none; font-family:inherit; font-size:15.5px; font-weight:800; cursor:pointer; transition:transform .08s, filter .15s;}
.btn:active{transform:scale(.98);}
.btn-primary{background:linear-gradient(135deg, var(--teal) 0%, var(--teal-dark) 100%); color:#fff; box-shadow:0 8px 20px -8px rgba(5,90,114,.55);}
.btn-primary:hover{filter:brightness(1.06);}
.btn-accent{background:linear-gradient(135deg, var(--burgundy) 0%, var(--burgundy-dark) 100%); color:#fff; box-shadow:0 8px 20px -8px rgba(153,17,74,.5);}
.btn-outline{background:#fff; color:var(--teal-dark); border:1.5px solid var(--border);}
.btn-outline:hover{border-color:var(--teal);}
.btn-ghost{background:transparent; color:var(--muted); font-weight:700; box-shadow:none; padding:10px;}
.btn-danger{background:#fff; color:var(--danger); border:1.5px solid #F1D3D0;}
.btn-sm{padding:9px 12px; font-size:13px; width:auto;}
.row{display:flex; gap:10px;}
.row > *{flex:1;}
.stepper{display:flex; align-items:center; gap:6px; margin-bottom:22px;}
.step-dot{flex:1; height:4px; border-radius:4px; background:var(--border);}
.step-dot.active{background:linear-gradient(90deg, var(--teal), var(--burgundy));}
.muted{color:var(--muted); font-size:13px;}
.hint-box{background:var(--teal-tint); border:1px dashed var(--teal); border-radius:12px; padding:12px 14px; font-size:13px; color:var(--teal-dark); margin-bottom:14px; line-height:1.6;}
.center{text-align:center;}
.mt8{margin-top:8px;} .mt12{margin-top:12px;} .mt16{margin-top:16px;} .mt24{margin-top:24px;}
.mb0{margin-bottom:0 !important;}
a.link{color:var(--teal); font-weight:700; text-decoration:none; cursor:pointer;}
a.link:hover{text-decoration:underline;}

/* Success screen */
.success-wrap{text-align:center; padding:10px 0 4px;}
.coin{
  width:120px; height:120px; margin:0 auto 18px; position:relative;
  border-radius:50%;
  background: radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 55%, #a97c0c 100%);
  box-shadow: 0 14px 30px -10px rgba(212,160,23,.65), inset 0 -6px 10px rgba(0,0,0,.15), inset 0 6px 10px rgba(255,255,255,.35);
  display:flex; align-items:center; justify-content:center; font-size:44px; font-weight:900; color:#5c4300;
  animation: coinPop .6s cubic-bezier(.34,1.56,.64,1) both, coinSpin 2.2s linear 1;
}
@keyframes coinPop{0%{transform:scale(0) rotateY(0deg);} 60%{transform:scale(1.12) rotateY(360deg);} 100%{transform:scale(1) rotateY(720deg);}}
@keyframes coinSpin{0%{filter:brightness(1);} 50%{filter:brightness(1.25);} 100%{filter:brightness(1);}}
.sef-amount{font-size:34px; font-weight:900; color:var(--gold); margin:6px 0 2px;}
.sef-amount span{font-size:16px; color:var(--muted); font-weight:700;}
.success-title{font-size:20px; font-weight:800; margin:8px 0 2px;}
.success-name{color:var(--muted); font-size:14px; margin-bottom:14px;}
.badge{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; font-size:12.5px; font-weight:800;}
.badge-ontime{background:#E6F4EC; color:var(--success);}
.badge-late{background:#FCEBE9; color:var(--danger);}
.badge-exception{background:var(--burgundy-tint); color:var(--burgundy);}
.badge-absent{background:#EEE; color:#777;}

/* Wallet */
.wallet-card{background:linear-gradient(135deg, var(--teal-dark), var(--teal) 60%, var(--burgundy)); border-radius:20px; padding:22px; color:#fff; position:relative; overflow:hidden; margin-bottom:18px;}
.wallet-card::after{content:''; position:absolute; inset:0; background:radial-gradient(circle at 90% -10%, rgba(255,255,255,.18), transparent 55%);}
.wallet-label{font-size:12px; opacity:.85; font-weight:700;}
.wallet-balance{font-size:36px; font-weight:900; margin:6px 0 2px; display:flex; align-items:baseline; gap:6px;}
.wallet-balance small{font-size:14px; font-weight:700; opacity:.85;}
.wallet-name{font-size:13.5px; opacity:.9; margin-top:8px;}
.txn{display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-bottom:1px solid var(--border);}
.txn:last-child{border-bottom:none;}
.txn-left{display:flex; flex-direction:column;}
.txn-title{font-weight:700; font-size:14px;}
.txn-sub{font-size:12px; color:var(--muted);}
.txn-amt{font-weight:800; font-size:15px;}
.txn-amt.pos{color:var(--success);}
.txn-amt.neg{color:var(--danger);}

/* Admin */
.tabs{display:flex; gap:6px; background:var(--surface); border:1px solid var(--border); padding:4px; border-radius:14px; margin-bottom:16px; overflow-x:auto;}
.tab{padding:9px 14px; border-radius:10px; font-size:13px; font-weight:800; color:var(--muted); cursor:pointer; white-space:nowrap;}
.tab.active{background:var(--teal); color:#fff;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
.stat-box{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px;}
.stat-box .num{font-size:24px; font-weight:900; color:var(--teal-dark);}
.stat-box .lbl{font-size:12px; color:var(--muted); font-weight:700; margin-top:2px;}
.stat-box.gold .num{color:var(--gold);}
.stat-box.burg .num{color:var(--burgundy);}
table{width:100%; border-collapse:collapse; font-size:13px;}
th{text-align:right; color:var(--muted); font-weight:700; padding:8px 6px; border-bottom:2px solid var(--border); font-size:11.5px;}
td{padding:9px 6px; border-bottom:1px solid var(--border); vertical-align:middle;}
.list-item{display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-bottom:1px solid var(--border);}
.list-item:last-child{border-bottom:none;}
.filters{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
.chip{padding:7px 12px; border-radius:999px; border:1.5px solid var(--border); font-size:12.5px; font-weight:700; cursor:pointer; color:var(--muted); background:#fff;}
.chip.active{background:var(--ink); color:#fff; border-color:var(--ink);}
.section-title{font-size:15px; font-weight:800; margin:22px 0 10px; display:flex; align-items:center; gap:8px;}
.divider{height:1px; background:var(--border); margin:18px 0;}
.modal-bg{position:fixed; inset:0; background:rgba(21,34,39,.5); display:flex; align-items:flex-end; justify-content:center; z-index:50; backdrop-filter:blur(2px);}
.modal{background:#fff; width:100%; max-width:520px; border-radius:20px 20px 0 0; padding:22px; max-height:88vh; overflow-y:auto; animation:slideUp .25s ease;}
@keyframes slideUp{from{transform:translateY(24px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.modal-head h3{margin:0; font-size:17px; font-weight:800;}
.close-x{width:32px; height:32px; border-radius:10px; background:var(--bg); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:15px; color:var(--muted);}
.toggle-row{display:flex; align-items:center; justify-content:space-between; padding:10px 0;}
.switch{position:relative; width:44px; height:26px; border-radius:20px; background:var(--border); cursor:pointer; transition:.2s;}
.switch.on{background:var(--teal);}
.switch::after{content:''; position:absolute; top:3px; right:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch.on::after{right:21px;}
.empty{text-align:center; padding:36px 10px; color:var(--muted);}
.empty .ic{font-size:34px; margin-bottom:8px;}
.toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:12px 20px; border-radius:12px; font-size:13.5px; font-weight:700; z-index:100; box-shadow:0 10px 30px rgba(0,0,0,.25); animation:toastIn .2s ease;}
@keyframes toastIn{from{opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);}}
.avatar-circle{width:44px; height:44px; border-radius:50%; background:linear-gradient(135deg,var(--teal),var(--burgundy)); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; flex-shrink:0;}
.spinner{width:18px; height:18px; border:2.5px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite; display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
::placeholder{color:#A8B5BA;}
.qr-box{background:#fff; padding:14px; border-radius:18px; display:flex; justify-content:center; border:1.5px solid var(--border); box-shadow:0 12px 30px -18px rgba(5,90,114,.35);}
.qr-api-img{width:280px; height:280px; max-width:100%; display:block; border-radius:12px; image-rendering:auto;}
.qr-meta{background:linear-gradient(135deg,var(--teal-tint),var(--burgundy-tint)); border:1px solid var(--border); border-radius:14px; padding:12px; margin-top:12px;}
.qr-thursday-badge{display:inline-flex; align-items:center; gap:6px; padding:6px 11px; border-radius:999px; background:rgba(212,160,23,.14); color:#8b6800; font-size:12px; font-weight:900;}

/* ========================= SEF WOW VISUAL SYSTEM ========================= */
:root{
  --bg:#050711;
  --surface:rgba(12,17,31,.76);
  --surface-2:rgba(18,24,43,.82);
  --ink:#F6F8FF;
  --muted:#AAB4CC;
  --border:rgba(255,255,255,.10);
  --teal:#16B8D4;
  --teal-dark:#07546D;
  --burgundy:#D51D69;
  --burgundy-dark:#7E1244;
  --gold:#F2C14E;
  --gold-light:#FFE7A1;
  --teal-tint:rgba(22,184,212,.12);
  --burgundy-tint:rgba(213,29,105,.12);
  --success:#55D98A;
  --danger:#FF6575;
  --radius:22px;
}
html{background:#050711;scroll-behavior:smooth;}
body{
  background:
    radial-gradient(900px 600px at 12% -5%, rgba(22,184,212,.18), transparent 65%),
    radial-gradient(850px 600px at 92% 4%, rgba(213,29,105,.18), transparent 62%),
    radial-gradient(700px 520px at 50% 110%, rgba(242,193,78,.07), transparent 65%),
    #050711;
  color:var(--ink);
  overflow-x:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:-3;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
  background-size:44px 44px;mask-image:linear-gradient(to bottom,black,transparent 92%);opacity:.5;
}
body::after{
  content:'';position:fixed;width:520px;height:520px;border-radius:50%;pointer-events:none;z-index:-2;
  right:-260px;top:35%;background:radial-gradient(circle,rgba(213,29,105,.18),transparent 68%);filter:blur(12px);animation:ambientDrift 12s ease-in-out infinite alternate;
}
#app{max-width:560px;position:relative;isolation:isolate;}
#app::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 50% 20%,rgba(22,184,212,.06),transparent 35%);}
.topbar{padding:18px 18px 12px;position:relative;z-index:5;}
.brand{padding:7px 10px;border:1px solid rgba(255,255,255,.08);background:rgba(8,12,24,.56);backdrop-filter:blur(18px);border-radius:18px;box-shadow:0 14px 38px rgba(0,0,0,.28),inset 0 1px rgba(255,255,255,.08);}
.brand img{width:42px;height:42px;border-radius:13px;box-shadow:0 0 22px rgba(22,184,212,.24);}
.brand-text b{color:#fff}.brand-text span{color:#9DA8C1}
.icon-btn{background:rgba(12,17,31,.68);border-color:rgba(255,255,255,.10);color:#EAF0FF;box-shadow:0 12px 30px rgba(0,0,0,.25);backdrop-filter:blur(16px);transition:transform .25s,box-shadow .25s,border-color .25s;}
.icon-btn:hover{border-color:rgba(22,184,212,.6);box-shadow:0 0 26px rgba(22,184,212,.18);transform:translateY(-2px);}
main{padding:8px 18px 24px;}
.card{
  background:linear-gradient(145deg,rgba(19,26,45,.84),rgba(8,12,24,.76));
  border:1px solid rgba(255,255,255,.10);border-radius:24px;padding:22px;
  box-shadow:0 26px 70px rgba(0,0,0,.38),inset 0 1px rgba(255,255,255,.07);
  backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  position:relative;overflow:hidden;
}
.card::before{content:'';position:absolute;inset:-2px;background:linear-gradient(120deg,rgba(22,184,212,.10),transparent 35%,rgba(213,29,105,.08));pointer-events:none;}
h1.hero{color:#fff}.sub,.muted{color:#AAB4CC!important}
label{color:#CDEBFF!important}
input[type=text],input[type=tel],input[type=password],input[type=number],input[type=date],input[type=time],select,textarea{
  color:#F5F7FF;background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.11);box-shadow:inset 0 1px rgba(255,255,255,.04);color-scheme:dark;
}
input::placeholder,textarea::placeholder{color:#77839C}
input:focus,select:focus,textarea:focus{border-color:rgba(22,184,212,.75);box-shadow:0 0 0 4px rgba(22,184,212,.10),0 0 28px rgba(22,184,212,.08);}
.btn{position:relative;overflow:hidden;transform:translateZ(0);box-shadow:0 14px 32px rgba(0,0,0,.25);transition:transform .25s,box-shadow .25s,filter .25s;}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,rgba(255,255,255,.22) 48%,transparent 72%);transform:translateX(-120%);transition:transform .65s;}
.btn:hover::before{transform:translateX(120%)}
.btn:hover{transform:translateY(-3px);box-shadow:0 18px 42px rgba(0,0,0,.35)}
.btn-primary{background:linear-gradient(135deg,#10A8C8,#07546D 65%,#073A4D);box-shadow:0 14px 34px rgba(9,142,173,.28),inset 0 1px rgba(255,255,255,.25)}
.btn-accent{background:linear-gradient(135deg,#E52A78,#8A1249 68%,#5E0D33);box-shadow:0 14px 34px rgba(213,29,105,.25),inset 0 1px rgba(255,255,255,.22)}
.btn-outline{background:rgba(255,255,255,.045);color:#EAF4FF;border-color:rgba(255,255,255,.14)}
.btn-ghost{color:#9DA8C1}
.hint-box{background:rgba(22,184,212,.08);border-color:rgba(22,184,212,.32);color:#CDEBFF}
.tabs{background:rgba(8,12,24,.68);border-color:rgba(255,255,255,.08);backdrop-filter:blur(16px)}
.tab{color:#AAB4CC}.tab.active{color:#fff;background:linear-gradient(135deg,rgba(22,184,212,.24),rgba(213,29,105,.20));box-shadow:inset 0 1px rgba(255,255,255,.08)}
.stat-box,.list-item,.wallet-card{background:rgba(255,255,255,.045)!important;border-color:rgba(255,255,255,.09)!important;color:#F6F8FF}
.wallet-card{background:linear-gradient(135deg,#07546D,#0C7186 48%,#8A1249)!important;box-shadow:0 25px 55px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.18)}
.wallet-card::before{content:'';position:absolute;width:190px;height:190px;border-radius:50%;right:-80px;top:-90px;background:rgba(255,255,255,.10);filter:blur(1px);}
.modal-bg{background:rgba(0,0,0,.76)!important;backdrop-filter:blur(12px)}
.modal{background:linear-gradient(145deg,#11182A,#080C18)!important;color:#fff;border-color:rgba(255,255,255,.12)!important;box-shadow:0 40px 100px rgba(0,0,0,.65),0 0 80px rgba(22,184,212,.08)!important}
table{color:#EAF0FF}.empty{color:#8E9AB2}.section-title{color:#fff!important}.txn{border-color:rgba(255,255,255,.08)}
/* 3D landing */
.landing-main{min-height:100vh;justify-content:flex-start;padding:22px 18px 40px;position:relative;overflow:hidden;}
.ambient-scene{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
.ambient-orb{position:absolute;border-radius:50%;filter:blur(2px);mix-blend-mode:screen;opacity:.75;}
.orb-a{width:280px;height:280px;right:-120px;top:8%;background:radial-gradient(circle,rgba(213,29,105,.30),transparent 68%);animation:orbFloat 8s ease-in-out infinite alternate;}
.orb-b{width:250px;height:250px;left:-120px;top:28%;background:radial-gradient(circle,rgba(22,184,212,.27),transparent 68%);animation:orbFloat 10s ease-in-out infinite alternate-reverse;}
.orb-c{width:190px;height:190px;right:25%;bottom:8%;background:radial-gradient(circle,rgba(242,193,78,.12),transparent 68%);animation:orbFloat 7s ease-in-out infinite alternate;}
.particle-field{position:absolute;inset:0;overflow:hidden;}
.particle-field i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 12px currentColor;opacity:.65;animation:particleDrift var(--dur) ease-in-out infinite alternate;}
.landing-hero{z-index:1;padding:34px 4px 8px;perspective:900px;}
.landing-logo{width:118px;height:118px;border-radius:32px;box-shadow:0 25px 60px rgba(0,0,0,.45),0 0 50px rgba(22,184,212,.18),0 0 35px rgba(213,29,105,.12);border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.04);animation:logo3d 4.8s ease-in-out infinite;}
.landing-title{font-size:32px;line-height:1.2;color:#fff;background:linear-gradient(90deg,#fff 10%,#9EEFFF 45%,#FF8CB9 82%,#fff);-webkit-background-clip:text;background-clip:text;text-shadow:0 8px 35px rgba(22,184,212,.16);margin-top:20px;}
.landing-sub{color:#AAB4CC;max-width:420px;margin-inline:auto;}
.landing-actions{z-index:2;gap:14px;margin-top:22px;}
.btn-lg{min-height:78px;border-radius:22px;padding:16px 18px;border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(16px);}
.btn-lg:first-child{background:linear-gradient(135deg,rgba(22,184,212,.88),rgba(5,84,109,.88));}
.btn-lg:nth-child(2){background:linear-gradient(135deg,rgba(213,29,105,.88),rgba(113,13,57,.88));}
.btn-emoji{filter:drop-shadow(0 0 12px rgba(255,255,255,.25))}
/* Thursday verse */
.thursday-verse{z-index:2;position:relative;margin:18px 0 4px;padding:20px 18px;border-radius:25px;background:linear-gradient(145deg,rgba(13,24,43,.92),rgba(31,10,31,.82));border:1px solid rgba(242,193,78,.28);box-shadow:0 25px 65px rgba(0,0,0,.38),0 0 40px rgba(242,193,78,.07),inset 0 1px rgba(255,255,255,.10);overflow:hidden;transform-style:preserve-3d;}
.thursday-verse::before{content:'';position:absolute;width:170px;height:170px;border-radius:50%;right:-70px;top:-90px;background:radial-gradient(circle,rgba(242,193,78,.24),transparent 68%);animation:verseGlow 3s ease-in-out infinite alternate;}
.thursday-verse::after{content:'✦';position:absolute;left:16px;bottom:4px;font-size:72px;color:rgba(242,193,78,.07);transform:rotate(-18deg);}

.qr-box{background:linear-gradient(145deg,#fff,#eaf2f5)!important;border-radius:24px!important;padding:18px!important;box-shadow:0 20px 60px rgba(0,0,0,.42),0 0 35px rgba(22,184,212,.12)!important;border:1px solid rgba(255,255,255,.65)!important;}

<script>
/* ============================= STORAGE HELPERS ============================= */
const SHARED = true;
async function sGet(key, fallback){
  try{
    const r = await window.storage.get(key, SHARED);
    return r ? JSON.parse(r.value) : fallback;
  }catch(e){ return fallback; }
}
async function sSet(key, value){
  try{ await window.storage.set(key, JSON.stringify(value), SHARED); }catch(e){ console.error('storage set failed', key, e); }
}

/* ============================= LOCAL STORAGE FALLBACK ============================= */
function lsGet(key, fallback){
  try{
    const r = localStorage.getItem(key);
    return r ? JSON.parse(r) : fallback;
  }catch(e){ return fallback; }
}
function lsSet(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
}

/* ============================= SESSION ANTI-TAMPER ============================= */
const SESSION_KEY = 'sef:session_claims';
function getSessionClaims(){
  try{ return JSON.parse(sessionStorage.getItem(SESSION_KEY)) || {}; }catch(e){ return {}; }
}
function claimSession(meetingId){
  const claims = getSessionClaims();
  claims[meetingId] = { claimedAt: new Date().toISOString(), consumed: true };
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(claims));
}
function hasClaimedSession(meetingId){
  return !!getSessionClaims()[meetingId];
}
function clearUrlMeetingCode(){
  if(window.history && window.history.replaceState){
    const url = window.location.origin + window.location.pathname;
    window.history.replaceState({}, document.title, url);
  }
  state.urlMeetingCode = null;
}

/* ============================= VERSE API (Bible API) ============================= */
const THURSDAY_REFERENCES = [
  'Philippians 4:13','Mark 9:23','Psalm 27:1','Isaiah 40:31','Isaiah 41:10',
  'Psalm 55:22','2 Timothy 1:7','Matthew 6:33','Joshua 1:9','1 Corinthians 1:9',
  'Romans 8:28','1 Corinthians 10:31'
];
const FALLBACK_VERSES = [
  {text:'أَسْتَطِيعُ كُلَّ شَيْءٍ فِي الْمَسِيحِ الَّذِي يُقَوِّينِي.', ref:'رسالة فيلبي (4:13)'},
  {text:'كُلُّ شَيْءٍ مُسْتَطَاعٌ لِلْمُؤْمِنِ.', ref:'مرقس (9:23)'},
  {text:'الرَّبُّ نُورِي وَخَلَاصِي، مِمَّنْ أَرْهَبُ؟', ref:'مزمور (27:1)'},
  {text:'أَمَّا الرَّاجُونَ الرَّبَّ فَيُجَدِّدُونَ قُوَّةً.', ref:'إشعياء (40:31)'},
  {text:'لاَ تَخَفْ لأَنِّي مَعَكَ. لاَ تَتَلَفَّتْ لأَنِّي إِلهُكَ.', ref:'إشعياء (41:10)'},
  {text:'أَلْقِ عَلَى الرَّبِّ هَمَّكَ فَهُوَ يَعُولُكَ.', ref:'مزمور (55:22)'},
  {text:'لأَنَّ اللهَ لَمْ يُعْطِنَا رُوحَ الْفَشَلِ، بَلْ رُوحَ الْقُوَّةِ وَالْمَحَبَّةِ وَالنُّصْحِ.', ref:'رسالة تيموثاوس الثانية (1:7)'},
  {text:'أَطْلُبُوا أَوَّلًا مَلَكُوتَ اللهِ وَبِرَّهُ، وَهذِهِ كُلُّهَا تُزَادُ لَكُمْ.', ref:'متى (6:33)'},
  {text:'كُنْ قَوِيًّا وَتَشَجَّعْ. لاَ تَخَفْ وَلاَ تَرْتَعِبْ.', ref:'يشوع (1:9)'},
  {text:'أَمِينٌ هُوَ اللهُ الَّذِي بِهِ دُعِيتُمْ إِلَى شَرِكَةِ ابْنِهِ.', ref:'كورنثوس الأولى (1:9)'},
  {text:'وَنَحْنُ نَعْلَمُ أَنَّ كُلَّ الأَشْيَاءِ تَعْمَلُ مَعًا لِلْخَيْرِ لِلَّذِينَ يُحِبُّونَ اللهَ.', ref:'رومية (8:28)'},
  {text:'فَإِنْ كُنْتُمْ تَأْكُلُونَ أَوْ تَشْرَبُونَ أَوْ تَفْعَلُونَ شَيْئًا، فَافْعَلُوا كُلَّ شَيْءٍ لِمَجْدِ اللهِ.', ref:'كورنثوس الأولى (10:31)'}
];

async function fetchVerseFromAPI(reference){
  try{
    // Try Arabic Van Dyke translation via bible-api.com
    const url = `https://bible-api.com/${encodeURIComponent(reference)}?translation=arbvd`;
    const res = await fetch(url, {cache: 'no-store'});
    if(!res.ok) throw new Error('API error');
    const data = await res.json();
    if(data && data.text && data.reference){
      return { text: data.text.trim(), ref: data.reference };
    }
  }catch(e){ console.warn('Verse API failed, using fallback', e); }
  return null;
}

async function getThursdayVerse(dateStr){
  // Check local cache first (per-day cache)
  const cacheKey = 'sef:verse_cache:' + dateStr;
  const cached = lsGet(cacheKey, null);
  if(cached && cached.text && cached.ref) return cached;

  const d = new Date(dateStr + 'T12:00:00');
  const first = new Date('2026-08-27T12:00:00');
  const weeks = Math.max(0, Math.floor((d-first)/(7*24*60*60*1000)));
  const refEn = THURSDAY_REFERENCES[weeks % THURSDAY_REFERENCES.length];
  const fallback = FALLBACK_VERSES[weeks % FALLBACK_VERSES.length];

  // Fetch from API
  const apiResult = await fetchVerseFromAPI(refEn);
  const result = apiResult || fallback;

  // Cache it for this date
  lsSet(cacheKey, result);
  return result;
}

function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

function sefNotes(balance){
  let remaining=Math.max(0,Math.floor(Number(balance)||0)), out=[];
  [50,30,20,10].forEach(v=>{const n=Math.floor(remaining/v); for(let i=0;i<n;i++)out.push(v); remaining-=n*v;});
  return out;
}
function renderSefNotes(balance, compact=false, animate=false){
  const total=Math.max(0,Math.floor(Number(balance)||0));
  const notes=sefNotes(total), represented=notes.reduce((a,b)=>a+b,0), change=total-represented;
  if(!total) return '<div class="empty wallet-empty">لا توجد أوراق SEF Dollars حتى الآن 💵</div>';
  const counts={}; notes.forEach(v=>counts[v]=(counts[v]||0)+1);
  const stacks=[50,30,20,10].filter(v=>counts[v]).map((v,i)=>{
    const c=counts[v], layers=Math.min(c,3);
    return `<div class="note-stack layers-${layers} ${animate?'drop':''}" style="--d:${i*0.12}s">
      <div class="note-art"><img src="${WALLET_ART[v]}" alt="${v} SEF Dollar">${c>1?`<em class="note-count">×${c}</em>`:''}</div>
      <div class="note-meta"><b>${v} SEF</b>${c>1?`<span>${c} أوراق = ${v*c} SEF</span>`:'<span>ورقة واحدة</span>'}</div>
    </div>`;}).join('');
  return `<div class="currency-grid ${compact?'compact':''}">${stacks}${change?`<div class="note-change ${animate?'drop':''}"><span class="nc-coin">🪙</span><b>+${change} SEF</b><small>فكة</small></div>`:''}</div>`;
}
function activeVouchers(user){return (user.vouchers||[]).filter(v=>v.status!=='cancelled');}
function renderVouchers(user, admin=false){
  const list=activeVouchers(user);
  if(!list.length) return '<div class="empty wallet-empty">لا توجد Gift Vouchers حتى الآن</div>';
  return `<div class="voucher-grid">${list.map(v=>`<div class="voucher-item"><img src="${WALLET_ART['v'+v.amount]}" alt="Gift Voucher ${v.amount} EGP"><div class="voucher-meta"><b>${v.amount} EGP</b><small>${v.issuedAt?new Date(v.issuedAt).toLocaleDateString('en-GB'):''}</small>${admin?`<button class="btn btn-outline btn-sm" data-action="cancelVoucher" data-phone="${user.phone}" data-id="${v.id}">إلغاء الفاوتشر</button>`:''}</div></div>`).join('')}</div>`;
}
function voucherTotal(user){return activeVouchers(user).reduce((sum,v)=>sum+(Number(v.amount)||0),0);}

function toast(msg){ state.toast = msg; render(); setTimeout(()=>{ state.toast=null; render(); }, 2600); }

/* ============================= BOOTSTRAP ============================= */
async function boot(){
  DB.users = await sGet('sef:users', {});
  DB.meetings = await sGet('sef:meetings', {});
  DB.attendance = await sGet('sef:attendance', []);
  DB.transactions = await sGet('sef:transactions', []);
  DB.exceptions = await sGet('sef:exceptions', []);
  DB.admin = await sGet('sef:admin', null);
  if(!DB.admin){
    const hash = await sha256('SEF@2026');
    DB.admin = { username:'admin', passwordHash: hash };
    await sSet('sef:admin', DB.admin);
  }
  // Read meeting code from the scanned QR link, e.g. ?m=SEF-4K9XZ
  try{
    const params = new URLSearchParams(window.location.search);
    if(params.get('m')) state.urlMeetingCode = params.get('m').toUpperCase();
  }catch(e){}
  if(Object.keys(DB.meetings).length === 0){
    // Do not create a fake daily meeting. The automatic meeting is Thursday-only.
    if(isThursday()){
      const id = uid('mtg');
      const verse = await getThursdayVerse(todayStr());
      state.currentVerse = verse;
      DB.meetings[id] = {
        id, name:'Youth Meeting', date:todayStr(),
        startTime:'19:30', code:genMeetingCode(), active:true,
        lateWindowMin:15, afterLateSef:0, auto:true, qrProvider:'quickchart',
        verseText: verse.text, verseRef: verse.ref
      };
      await sSet('sef:meetings', DB.meetings);
    }
  } else {
    await ensureTodayMeeting();
  }
  // Always load the verse for today (or next Thursday) so landingScreen can display it
  const verseDate = isThursday() ? todayStr() : nextThursdayStr();
  if(!state.currentVerse){
    state.currentVerse = await getThursdayVerse(verseDate);
  }
  render();
}
function meetingLink(code){
  const base = window.location.origin + window.location.pathname;
  return base + '?m=' + encodeURIComponent(code);
}
// External QR image API (no QR library or API key required for the basic endpoint).
// The QR contains the direct meeting URL, so the phone camera can open it immediately.
function qrApiUrl(text){
  const params = new URLSearchParams({
    text, size:'600', margin:'3', ecLevel:'H', dark:'055A72', light:'FFFFFF',
    dotStyle:'rounded', finderStyle:'rounded', finderDotStyle:'dot', finderColor:'99114A', format:'png'
  });
  return 'https://quickchart.io/qr?' + params.toString();
}
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function isThursday(){ return new Date().getDay()===4; }
function nextThursdayStr(){ const d=new Date(); const delta=(4-d.getDay()+7)%7 || 7; d.setDate(d.getDate()+delta); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }


/* Which meeting should this check-in count toward:
   1) the meeting encoded in the scanned QR link (?m=CODE), if it still exists
   2) otherwise, whichever meeting is currently marked active */
function targetMeeting(){
  if(state.urlMeetingCode){
    const byCode = Object.values(DB.meetings).find(m => m.code.toUpperCase() === state.urlMeetingCode);
    if(byCode) return byCode;
  }
  return currentMeeting();
}
/* Auto-generates a fresh meeting (new QR code) for today if one doesn't exist yet,
   inheriting settings (name/time/late rules) from the most recent meeting.
   Runs on every app load — the first person (admin or member) who opens the app
   each day triggers the generation and it syncs to everyone via shared storage. */
async function ensureTodayMeeting(){
  // Automatic meetings are generated only on Thursdays.
  // Manual meetings from the admin panel remain available on any date.
  if(!isThursday()) return;
  const today = todayStr();
  const already = Object.values(DB.meetings).find(m => m.date === today);
  if(already) return;
  const list = Object.values(DB.meetings).sort((a,b)=> new Date(b.date)-new Date(a.date));
  const template = list[0];
  const id = uid('mtg');
  Object.values(DB.meetings).forEach(m=> m.active=false);
  const verse = await getThursdayVerse(today);
  state.currentVerse = verse;
  DB.meetings[id] = {
    id, name: template ? template.name : 'Youth Meeting', date: today,
    startTime: template ? template.startTime : '19:30',
    code: genMeetingCode(), active:true,
    lateWindowMin: template ? (template.lateWindowMin ?? 15) : 15,
    afterLateSef: template ? (template.afterLateSef ?? 0) : 0,
    auto:true, qrProvider:'quickchart',
    verseText: verse.text, verseRef: verse.ref
  };
  await sSet('sef:meetings', DB.meetings);
}
function genMeetingCode(){ return 'SEF-' + Math.random().toString(36).slice(2,7).toUpperCase(); }

/* ============================= SEF CALCULATION ============================= */
function computeSefForMinutesLate(minutesLate, meeting){
  if(minutesLate <= 0) return 100;
  const table = 100 - (minutesLate*5);
  const win = meeting.lateWindowMin ?? 15;
  if(minutesLate > win) return meeting.afterLateSef ?? 0;
  return Math.max(0, table);
}
function statusForMinutesLate(minutesLate, meeting){
  if(minutesLate <= 0) return 'On Time';
  const win = meeting.lateWindowMin ?? 15;
  return minutesLate > win ? 'Absent/Late' : 'Late';
}

function findActiveExceptionFor(phone, meeting){
  const now = new Date();
  const list = DB.exceptions.filter(e => e.active && e.phone === phone);
  for(const ex of list){
    let applies = false;
    if(ex.scope === 'permanent') applies = true;
    else if(ex.scope === 'single') applies = ex.meetingId === meeting.id;
    else if(ex.scope === 'multiple') applies = meeting.date <= ex.validUntilDate;
    if(applies) return ex;
  }
  return null;
}

/* Core check-in logic */
async function performCheckIn(meeting){
  if(!isThursday()){
    return { error:'thursday_only', message:'تسجيل الحضور متاح يوم الخميس فقط. تقدر تسجّل عضويتك في أي يوم.' };
  }
  const phone = state.phone;
  const user = DB.users[phone];
  const meetingStart = new Date(meeting.date + 'T' + meeting.startTime + ':00');
  const now = new Date();
  const already = DB.attendance.find(a => a.meetingId === meeting.id && a.phone === phone);
  if(already){
    return { error:'already', message:'لقد سجّلت حضورك بالفعل لهذا الاجتماع 👀' };
  }
  const minutesLate = Math.floor((now - meetingStart)/60000);
  const exception = findActiveExceptionFor(phone, meeting);

  let sef, status, exceptionApplied=false, note='';
  if(exception){
    exceptionApplied = true;
    const deadline = exception.customCheckinUntil ? new Date(meeting.date + 'T' + exception.customCheckinUntil + ':00') : null;
    if(deadline && now > deadline){
      return { error:'late_exception', message:'انتهت مهلة الحضور المسموحة حتى ' + exception.customCheckinUntil + ' حسب الاستثناء الخاص بك.' };
    }
    if(exception.sefMode === 'full'){
      sef = 100;
    } else if(exception.sefMode === 'custom'){
      sef = Number(exception.sefAmount) || 0;
    } else {
      sef = computeSefForMinutesLate(Math.max(0,minutesLate), meeting);
    }
    status = 'Exception';
    note = exception.reason || '';
  } else {
    if(minutesLate > (meeting.lateWindowMin ?? 15)){
      return { error:'too_late', message:'تجاوزت الوقت المسموح لتسجيل الحضور. تواصل مع الإدارة إذا كان لديك عذر.' };
    }
    sef = computeSefForMinutesLate(Math.max(0,minutesLate), meeting);
    status = minutesLate <= 0 ? 'On Time' : 'Late';
  }

  const record = {
    id: uid('att'), meetingId: meeting.id, meetingName: meeting.name, phone, name: user.name,
    date: meeting.date, time: now.toTimeString().slice(0,5), sef, status, exceptionApplied, note,
    createdAt: now.toISOString(), source:'self'
  };
  DB.attendance.push(record);
  await sSet('sef:attendance', DB.attendance);

  const txn = { id: uid('txn'), phone, amount: sef, type:'attendance', meeting: meeting.name, date: meeting.date, createdBy:'system', description: exceptionApplied ? 'حضور مع استثناء: '+note : 'حضور اجتماع' };
  DB.transactions.push(txn);
  await sSet('sef:transactions', DB.transactions);

  user.sefBalance = (user.sefBalance||0) + sef;
  DB.users[phone] = user;
  await sSet('sef:users', DB.users);

  return { ok:true, record, sef, status, exceptionApplied, balance:user.sefBalance, name:user.name, time:record.time };
}

/* Looks up today's/scanned meeting and performs the check-in immediately —
   no code typing required from the member. */
async function doCheckIn(){
  if(!isThursday()){
    toast('تسجيل الحضور متاح يوم الخميس فقط. تقدر تسجّل عضويتك في أي يوم.');
    state.flow = 'landing'; render();
    return;
  }
  const meeting = targetMeeting();
  if(!meeting){
    toast('لا يوجد اجتماع مفتوح دلوقتي، تواصل مع الإدارة');
    state.flow = 'landing'; render();
    return;
  }
  // Anti-tamper: block if this session already claimed this meeting
  if(hasClaimedSession(meeting.id)){
    toast('لقد سجّلت حضورك بالفعل لهذا الاجتماع في هذه الجلسة 👀');
    state.flow = 'landing'; render();
    return;
  }
  const result = await performCheckIn(meeting);
  if(result.error){ toast(result.message); state.flow='landing'; render(); return; }
  // Anti-tamper: mark session as claimed and wipe ?m= from URL
  claimSession(meeting.id);
  clearUrlMeetingCode();
  state.lastResult = result;
  state.flow = 'success'; render();
}

/* ============================= RENDER ROUTER ============================= */
function render(){
  const app = document.getElementById('app');
  let html = '';
  if(state.view === 'checkin') html = viewCheckin();
  else if(state.view === 'wallet') html = viewWallet();
  else if(state.view === 'adminLogin') html = viewAdminLogin();
  else if(state.view === 'admin') html = viewAdmin();
  html += state.toast ? `<div class="toast">${state.toast}</div>` : '';
  app.innerHTML = html;
  bindEvents();
}

function currentMeeting(){
  const list = Object.values(DB.meetings).sort((a,b)=> new Date(b.date)-new Date(a.date));
  return list.find(m=>m.active) || list[0];
}

function adminLive(){
  const m = currentMeeting();
  if(!m) return `<div class="empty">لا يوجد اجتماعات بعد</div>`;
  const recs = DB.attendance.filter(a=>a.meetingId===m.id);
  const onTime = recs.filter(r=>r.status==='On Time').length;
  const late = recs.filter(r=>r.status==='Late').length;
  const exc = recs.filter(r=>r.status==='Exception').length;
  const total = recs.length;
  const byMinute = {};
  recs.forEach(r=>{ byMinute[r.time] = (byMinute[r.time]||0)+1; });
  const minuteRows = Object.keys(byMinute).sort().map(t=>`<tr><td>${t}</td><td>${byMinute[t]}</td></tr>`).join('');

    <div class="card mt8" style="background:linear-gradient(135deg, var(--teal-dark), var(--teal)); color:#fff; text-align:center; cursor:pointer;" data-action="showQr" data-id="${m.id}">

      <div class="section-title" style="margin-top:0;">🟢 ${escapeHtml(m.name)} — ${m.date}</div>
      <p class="muted mb0">بدء الاجتماع: ${m.startTime} &nbsp;•&nbsp; كود الاجتماع: <b style="direction:ltr; display:inline-block;">${m.code}</b></p>
    </div>
    <div class="stat-grid mt16">
      <div class="stat-box"><div class="num">${total}</div><div class="lbl">إجمالي الحضور</div></div>

      <div class="stat-box"><div class="num" style="color:var(--danger)">${late}</div><div class="lbl">متأخر</div></div>
      <div class="stat-box burg"><div class="num">${exc}</div><div class="lbl">استثناء</div></div>

function scopeLabel(e){
  const map = {single:'اجتماع واحد', multiple:'حتى '+e.validUntilDate, permanent:'دائم'};

  if(e.customCheckinUntil) s += ' · حتى ' + e.customCheckinUntil;
  if(e.sefMode==='full') s += ' · مكافأة كاملة';
  if(e.sefMode==='custom') s += ' · '+e.sefAmount+' SEF';
  return s;
}

/* ============================= EVENT HANDLING ============================= */
function escapeHtml(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function val(id){ const el = document.getElementById(id); return el ? el.value : ''; }

function bindEvents(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', onAction);
  });
  // dynamic select listeners inside exception modal
  const scopeSel = document.getElementById('ex-scope');
  if(scopeSel){
    scopeSel.addEventListener('change', ()=>{
      const extra = document.getElementById('ex-scope-extra');
      if(scopeSel.value==='single'){
        const meetings = Object.values(DB.meetings).sort((a,b)=> new Date(b.date)-new Date(a.date));
        extra.innerHTML = `<label>الاجتماع</label><select id="ex-meeting">${meetings.map(m=>`<option value="${m.id}">${escapeHtml(m.name)} (${m.date})</option>`).join('')}</select>`;
      } else if(scopeSel.value==='multiple'){
        extra.innerHTML = `<label>سارٍ حتى تاريخ</label><input type="date" id="ex-until-date" value="${new Date().toISOString().slice(0,10)}"/>`;
      } else extra.innerHTML = '';
    });
    scopeSel.dispatchEvent(new Event('change'));
  }
  const customToggle = document.getElementById('ex-custom-toggle');
  if(customToggle){
    customToggle.addEventListener('click', ()=>{
      const on = customToggle.dataset.on==='1';
      customToggle.dataset.on = on?'0':'1';
      customToggle.classList.toggle('on');
      document.getElementById('ex-custom-time-wrap').style.display = on?'none':'block';
    });
  }
  const sefModeSel = document.getElementById('ex-sefmode');
  if(sefModeSel){
    sefModeSel.addEventListener('change', ()=>{
      document.getElementById('ex-sefamount-wrap').style.display = sefModeSel.value==='custom'?'block':'none';
    });
  }
  const mfActive = document.getElementById('mf-active');
  if(mfActive){
    mfActive.addEventListener('click', ()=>{
      const on = mfActive.dataset.on==='1';
      mfActive.dataset.on = on?'0':'1';
      mfActive.classList.toggle('on');
    });
  }
  // QR is rendered by the external QuickChart API inside qrModal().
  ['inp-phone','inp-name','inp-wallet-phone','inp-admin-user','inp-admin-pass','inp-search-user'].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.addEventListener('keydown', e=>{ if(e.key==='Enter') primaryActionFor(id); });
  });
  const searchInp = document.getElementById('inp-search-user');
  if(searchInp) searchInp.addEventListener('input', ()=>{ state.searchPhone = searchInp.value; render(); document.getElementById('inp-search-user').focus(); document.getElementById('inp-search-user').selectionStart = document.getElementById('inp-search-user').value.length; });

  // Ambient particles + subtle 3D tilt for cards/buttons on pointer devices.
  const pf = document.querySelector('.particle-field');
  if(pf && !pf.dataset.ready){
    pf.dataset.ready='1';
    for(let i=0;i<24;i++){
      const dot=document.createElement('i');
      dot.style.left=(Math.random()*100)+'%'; dot.style.top=(Math.random()*100)+'%';
      dot.style.setProperty('--dur',(5+Math.random()*8)+'s');
      dot.style.setProperty('--dx',((Math.random()-.5)*70)+'px');
      dot.style.setProperty('--dy',((Math.random()-.5)*100)+'px');
      dot.style.color=i%3===0?'#F2C14E':(i%2===0?'#16B8D4':'#D51D69');
      dot.style.animationDelay=(-Math.random()*8)+'s';
      pf.appendChild(dot);
    }
  }
  document.querySelectorAll('.tilt-card').forEach(el=>{
    if(el.dataset.tiltBound) return;
    el.dataset.tiltBound='1';
    el.addEventListener('pointermove',e=>{
      if(window.matchMedia('(hover: none)').matches) return;
      const r=el.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
      el.style.transform=`perspective(900px) rotateX(${(-y*5).toFixed(2)}deg) rotateY(${(x*6).toFixed(2)}deg) translateY(-3px)`;
    });
    el.addEventListener('pointerleave',()=>{el.style.transform='';});
  });
  // Hidden admin entry: tap the logo 5 times within 2 seconds
  const logoHit = document.getElementById('brand-logo-hit');
  if(logoHit){
    logoHit.addEventListener('click', ()=>{
      const now = Date.now();
      if(!window.__logoTaps || now - window.__lastTap > 2000) window.__logoTaps = 0;
      window.__logoTaps++; window.__lastTap = now;
      if(window.__logoTaps >= 5){ window.__logoTaps = 0; state.view='adminLogin'; render(); }
    });
  }
}
function primaryActionFor(id){
  if(id==='inp-phone' || id==='inp-name'){
    if(state.flow==='new_form') return handleAction('submitNewForm', {});
    if(state.flow==='returning_phone') return handleAction('submitReturningPhone', {});
    return;
  }
  const map = { 'inp-wallet-phone':'openWallet','inp-admin-user':'submitAdminLogin','inp-admin-pass':'submitAdminLogin' };
  if(map[id]) handleAction(map[id], {});
}

async function onAction(e){
  const el = e.currentTarget;
  const action = el.dataset.action;
  await handleAction(action, el.dataset);
}

async function handleAction(action, data){
  switch(action){
    case 'wallet': state.view='wallet'; state.walletVerified=false; state.walletPhone=''; render(); break;
    case 'checkin': state.view='checkin'; render(); break;
    case 'adminLogin': state.view='adminLogin'; render(); break;
    case 'backToCheckin': state.view='checkin'; state.flow='landing'; render(); break;
    case 'logoutAdmin': state.view='checkin'; state.flow='landing'; render(); break;

    case 'goLanding': state.flow='landing'; state.phone=''; state.name=''; render(); break;
    case 'goNewForm': state.flow='new_form'; render(); break;
    case 'goReturningPhone': state.flow='returning_phone'; render(); break;

    case 'submitNewForm': {
      const name = val('inp-name').trim();
      const phone = val('inp-phone').trim();
      if(!name){ toast('اكتب اسمك'); return; }
      if(phone.length < 8){ toast('أدخل رقم موبايل صحيح'); return; }
      if(DB.users[phone]){ toast('الرقم ده مسجّل بالفعل، جرّب "أنا مسجّل بالفعل"'); return; }
      state.phone = phone; state.name = name;
      DB.users[phone] = { name, phone, sefBalance:0, vouchers:[], createdAt: new Date().toISOString() };
      await sSet('sef:users', DB.users);
      state.phone = phone;
      state.name = name;
      state.walletPhone = phone;
      state.walletVerified = true;
      state.view = 'wallet';
      state.flow = 'landing';
      toast('تم إنشاء عضويتك بنجاح 🎉 تسجيل الحضور متاح يوم الخميس فقط.');
      render();
      break;
    }
    case 'submitReturningPhone': {
      const phone = val('inp-phone').trim();
      if(phone.length < 8){ toast('أدخل رقم موبايل صحيح'); return; }
      const user = DB.users[phone];
      if(!user){ toast('الرقم ده مش مسجل، جرّب "أول مرة هنا؟"'); return; }
      state.phone = phone; state.name = user.name;
      state.flow = 'processing'; render();
      await doCheckIn();
      break;
    }

    case 'restart': state.flow='landing'; state.phone=''; state.name=''; state.lastResult=null; state.returningUser=null; render(); break;
    case 'goWalletDirect': state.view='wallet'; state.walletPhone=state.phone; state.walletVerified=true; render(); break;

    case 'openWallet': {
      const phone = val('inp-wallet-phone').trim();
      if(!DB.users[phone]){ toast('هذا الرقم غير مسجل بعد'); return; }
      state.walletPhone = phone;
      state.walletVerified = true;
      render();
      break;
    }

    case 'submitAdminLogin': {
      const u = val('inp-admin-user').trim();
      const p = val('inp-admin-pass');
      const hash = await sha256(p);
      if(u === DB.admin.username && hash === DB.admin.passwordHash){
        state.view = 'admin'; state.adminTab='live'; render();
      } else toast('بيانات الدخول غير صحيحة');
      break;
    }
    case 'saveAdminSettings': {
      const newUser = val('set-admin-user').trim();
      const newPass = val('set-admin-pass');
      if(newUser) DB.admin.username = newUser;
      if(newPass) DB.admin.passwordHash = await sha256(newPass);
      await sSet('sef:admin', DB.admin);
      toast('تم الحفظ بنجاح');
      break;
    }
    case 'adminTab': state.adminTab = data.tab; state.searchedUser=null; render(); break;
    case 'filterAttendance': state.attendanceFilter = data.f; render(); break;

    case 'openMeetingForm': state.modal = meetingFormModal(); render(); break;
    case 'generateToday': {
      if(!isThursday()){ toast('التوليد التلقائي للاجتماع بيتم يوم الخميس فقط.'); break; }
      await ensureTodayMeeting();
      toast('تم توليد اجتماع الخميس بكود QR جديد عبر API ✅'); render();
      break;
    }
    case 'editMeeting': state.modal = meetingFormModal(data.id); render(); break;
    case 'showQr': state.qrTarget = meetingLink(DB.meetings[data.id].code); state.modal = qrModal(data.id); render(); break;
    case 'copyQrLink': {
      try{ await navigator.clipboard.writeText(state.qrTarget); toast('تم نسخ الرابط ✅'); }
      catch(e){ toast('انسخ الرابط الظاهر تحت الكود يدويًا'); }
      break;
    }
    case 'openQrLink': {
      if(state.qrTarget) window.open(state.qrTarget, '_blank', 'noopener');
      break;
    }
    case 'closeModal': case 'closeModalBg': closeModal(); break;
    case 'saveMeeting': {
      const id = data.id || uid('mtg');
      const activeToggle = document.getElementById('mf-active');
      const active = activeToggle ? activeToggle.dataset.on==='1' : true;
      if(active){ Object.values(DB.meetings).forEach(m=> m.active=false); }
      DB.meetings[id] = {
        id, name: val('mf-name')||'Meeting', date: val('mf-date'), startTime: val('mf-time'),
        code: val('mf-code').toUpperCase(), active,
        lateWindowMin: Number(val('mf-window'))||15, afterLateSef: Number(val('mf-afterlate'))||0
      };
      await sSet('sef:meetings', DB.meetings);
      closeModal(); toast('تم حفظ الاجتماع'); state.adminTab='meetings'; render();
      break;
    }

    case 'openUser': state.searchedUser = data.phone; render(); break;
    case 'closeUser': state.searchedUser = null; render(); break;
    case 'editUser': state.modal = userFormModal(data.phone); render(); break;
    case 'addVoucher': state.modal = voucherFormModal(data.phone); render(); break;
    case 'saveVoucher': {
      const phone=data.phone, user=DB.users[phone], amount=Number(val('vf-amount'));
      if(!user || ![50,75,100].includes(amount)){toast('اختار فئة فاوتشر صحيحة');return;}
      user.vouchers=user.vouchers||[]; user.vouchers.push({id:uid('vch'),amount,status:'active',issuedAt:new Date().toISOString(),createdBy:DB.admin.username});
      await sSet('sef:users',DB.users); closeModal(); toast('تمت إضافة Gift Voucher بنجاح'); state.searchedUser=phone; state.adminTab='users'; render(); break;
    }
    case 'cancelVoucher': {
      const user=DB.users[data.phone], voucher=(user?.vouchers||[]).find(v=>v.id===data.id);
      if(voucher){voucher.status='cancelled';voucher.cancelledAt=new Date().toISOString();await sSet('sef:users',DB.users);toast('تم إلغاء الفاوتشر');state.searchedUser=data.phone;render();}
      break;
    }
    case 'saveUser': {
      const phone = data.phone || val('uf-phone').trim();
      const name = val('uf-name').trim();
      if(!phone || !name){ toast('أكمل البيانات'); return; }
      DB.users[phone] = { ...(DB.users[phone]||{sefBalance:0,vouchers:[],createdAt:new Date().toISOString()}), name, phone };
      await sSet('sef:users', DB.users);
      closeModal(); toast('تم الحفظ'); render();
      break;
    }
    case 'addManualAttendance': state.modal = manualAttendanceModal(data.phone); render(); break;
    case 'saveManualAttendance': {
      const phone = data.phone;
      const meeting = DB.meetings[val('ma-meeting')];
      const sef = Number(val('ma-sef'))||0;
      const record = { id: uid('att'), meetingId: meeting.id, meetingName: meeting.name, phone, name: DB.users[phone].name,
        date: meeting.date, time: val('ma-time'), sef, status: val('ma-status'), exceptionApplied: val('ma-status')==='Exception', note:'يدوي من الإدارة', createdAt: new Date().toISOString(), source:'manual' };
      DB.attendance.push(record); await sSet('sef:attendance', DB.attendance);
      const txn = { id: uid('txn'), phone, amount: sef, type:'manual', meeting: meeting.name, date: meeting.date, createdBy: DB.admin.username, description:'حضور يدوي' };
      DB.transactions.push(txn); await sSet('sef:transactions', DB.transactions);
      DB.users[phone].sefBalance = (DB.users[phone].sefBalance||0)+sef; await sSet('sef:users', DB.users);
      closeModal(); toast('تم تسجيل الحضور اليدوي'); render();
      break;
    }
    case 'deleteAttendance': {
      const rec = DB.attendance.find(a=>a.id===data.id);
      if(rec){
        DB.attendance = DB.attendance.filter(a=>a.id!==data.id);
        await sSet('sef:attendance', DB.attendance);
        if(DB.users[rec.phone]){ DB.users[rec.phone].sefBalance = (DB.users[rec.phone].sefBalance||0) - rec.sef; await sSet('sef:users', DB.users); }
        toast('تم الحذف'); render();
      }
      break;
    }

    case 'openExceptionForm': state.modal = exceptionFormModal(data.phone); render(); break;
    case 'saveException': {
      const phone = val('ex-phone');
      const scope = val('ex-scope');
      const meetingId = scope==='single' ? val('ex-meeting') : null;
      const validUntilDate = scope==='multiple' ? val('ex-until-date') : null;
      const customToggle = document.getElementById('ex-custom-toggle');
      const customCheckinUntil = customToggle && customToggle.dataset.on==='1' ? val('ex-custom-time') : null;
      const sefMode = val('ex-sefmode');
      const sefAmount = sefMode==='custom' ? Number(val('ex-sefamount'))||0 : null;
      const ex = { id: uid('exc'), phone, name: DB.users[phone]?.name, reason: val('ex-reason')||'—', scope, meetingId, validUntilDate,
        customCheckinUntil, sefMode, sefAmount, createdBy: DB.admin.username, createdAt: new Date().toISOString(), active:true };
      DB.exceptions.push(ex); await sSet('sef:exceptions', DB.exceptions);
      closeModal(); toast('تم إضافة الاستثناء'); state.adminTab='exceptions'; render();
      break;
    }
    case 'toggleException': {
      const ex = DB.exceptions.find(e=>e.id===data.id);
      if(ex){ ex.active = !ex.active; await sSet('sef:exceptions', DB.exceptions); render(); }
      break;
    }
    case 'deleteException': {
      DB.exceptions = DB.exceptions.filter(e=>e.id!==data.id);
      await sSet('sef:exceptions', DB.exceptions);
      toast('تم حذف الاستثناء'); render();
      break;
    }

    case 'exportCsv': {
      const rows = [['Name','Phone','Meeting','Date','Time','SEF','Status']];
      DB.attendance.forEach(a=> rows.push([a.name,a.phone,a.meetingName,a.date,a.time,a.sef,a.status]));
      const csv = rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
      const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8;'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href=url; a.download='sef_attendance.csv'; a.click();
      break;
    }
  }
}

boot();
</script>
</body>
</html>
